name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's result irrelevant. Without
# this, both run to completion - and the expensive jobs here are a full release
# build of the workspace plus an end-to-end run, so the waste is minutes, not
# seconds. `main` is excluded from cancellation: its runs are the record of what
# was merged, and cancelling one leaves a commit with no result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain version here on purpose: `rust-toolchain.toml` is the
      # single source of truth, and `rustup show` installs exactly what it
      # names. Pinning the version in the workflow as well would let the two
      # drift apart, which is the failure this pinning exists to prevent.
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Verify the pinned toolchain is what we are actually using
        run: |
          expected="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          echo "pinned=$expected active=$actual"
          [ "$actual" = "$expected" ] || {
            echo "::error::rustc $actual does not match the pinned $expected"
            exit 1
          }

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Release, not debug: cpu.mixed calibration in a debug build wastes
      # minutes, and debug builds are not comparable anyway.
      - name: Test
        run: cargo test --workspace --release

  # The cross-platform ratchet (ADR-0015).
  #
  # This job lists the crates that are portable *today* and builds them on
  # Windows and macOS. The list only ever grows: a crate is added when it
  # becomes portable, and removing one is a deliberate act that has to be
  # argued for in a pull request. That is what turns "the core is portable"
  # from an assertion into something CI can fail on.
  #
  # Not advisory. The other advisory jobs here exist because their input can
  # change underneath us (latest stable clippy, a future MSRV). This one is
  # entirely within our control, so a regression is a bug, not news.
  #
  # `darcbench-core` joined here when it was extracted out of `darcbench-modules`
  # (ADR-0015). Green on both runners is what makes "the engine is portable" a
  # fact rather than a claim.
  #
  # `darcbench-report` is deliberately absent: it depends on
  # `darcbench-inventory`, which is /proc and /sys. It joins the list when
  # `HostFacts` lands. `darcbench-modules` never joins - it is the server line,
  # and it is Linux-only by design.
  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      PORTABLE_CRATES: "-p darcbench-protocol -p darcbench-scoring -p darcbench-core"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Same intent as the `rust` job's pin check, written portably: that job
      # uses `grep -oP`, which is GNU-only and is not what macOS ships. The
      # check matters more here than anywhere else - a different rustc means
      # different codegen, and cross-OS numbers produced by two compilers
      # measure the compilers.
      - name: Verify the pinned toolchain is what we are actually using
        run: |
          expected="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          echo "pinned=$expected active=$actual"
          [ "$actual" = "$expected" ] || {
            echo "::error::rustc $actual does not match the pinned $expected"
            exit 1
          }

      - name: Clippy
        run: cargo clippy $PORTABLE_CRATES --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test $PORTABLE_CRATES --release

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` here: action-setup reads the pinned `packageManager` field
      # from apps/web/package.json, so the pin has exactly one home.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # Run from apps/web, the directory the pin lives in and the directory the
      # build step runs from. Checking from the repository root would report the
      # ambient pnpm rather than the one that will actually do the install.
      - name: Verify the pinned package manager is what we are actually using
        working-directory: apps/web
        run: |
          expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual="$(pnpm --version)"
          echo "pinned=$expected active=$actual"
          [ "$actual" = "$expected" ] || {
            echo "::error::pnpm $actual does not match the pinned $expected"
            exit 1
          }

      # Deliberately the whole chain in one step, not two: this is exactly what
      # a contributor runs, and it is the chain that broke when pnpm 11 turned
      # ignored build scripts into a hard error. Splitting it would hide a
      # non-zero exit from `install` behind a separately-green `build`.
      #
      # `working-directory`, not `pnpm --dir apps/web` from the root: Corepack
      # and pnpm's own version manager both resolve `packageManager` from the
      # invocation directory, and Corepack never sees `--dir`. Running from the
      # root would test an invocation style that silently ignores the pin, which
      # is not the one contributors are told to use.
      - name: Install and build
        working-directory: apps/web
        run: pnpm install --frozen-lockfile && pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Build agent with the UI embedded
        run: cargo build --release -p darcbench-agent

      - name: Protocol parity (Rust enum vs TypeScript)
        run: ./scripts/check-protocol-parity.sh

      - name: Module manifests match the compiled registry
        run: ./scripts/check-manifests.sh

      - name: End-to-end
        run: ./scripts/e2e.sh

  lint-latest:
    name: Lint on latest stable (advisory)
    runs-on: ubuntu-latest
    # Never blocks a merge. Its job is to surface lints from a newer toolchain
    # *before* someone bumps the pin, instead of discovering them as a red CI
    # run afterwards - which is precisely how the 1.94-to-1.97 clippy failure
    # was found.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install current stable
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Report the version gap
        run: |
          echo "pinned : $(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          echo "stable : $(rustup run stable rustc --version | cut -d' ' -f2)"
      - name: Clippy on stable
        run: rustup run stable cargo clippy --all-targets --all-features -- -D warnings
      - name: Format on stable
        run: rustup run stable cargo fmt --all -- --check

  msrv:
    name: MSRV (advisory)
    runs-on: ubuntu-latest
    # `rust-version` in the workspace Cargo.toml promises consumers can build
    # this with 1.82. Nothing verified that promise: CI built with the pinned
    # 1.97.1 and with current stable, and both are far newer, so an MSRV
    # violation introduced by a dependency bump or a newer language feature
    # would have shipped unnoticed.
    #
    # Advisory for the same reason `lint-latest` is: the point is to make the
    # gap visible before it blocks anyone. Promote it to a blocking job once it
    # has been green for a release, or raise `rust-version` to whatever it
    # actually needs - either is an honest answer; the current silence is not.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the declared MSRV toolchain
        run: |
          msrv="$(grep -oP '(?<=^rust-version = ")[^"]+' Cargo.toml)"
          echo "declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      # `check`, not `test`: the promise is that a consumer can build the
      # workspace, and the test suite pulls in dev-dependencies whose own MSRV
      # is not part of that promise.
      - name: Check the workspace builds at the declared MSRV
        run: rustup run "$MSRV" cargo check --workspace --all-features --locked

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      # Prebuilt binaries, not `cargo install`. Building these two from source
      # took several minutes of every CI run and produced a byte-identical
      # result each time; they are tools this workflow runs, not dependencies of
      # the product, so there is nothing to be gained from compiling them here.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Advisory audit
        run: cargo audit
      - name: Licence and dependency policy
        run: cargo deny check licenses bans sources
      # SBOM generation and artifact signing land in Phase 8; see
      # docs/RELEASE-STRATEGY.md.

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A script rather than an inline block, so a contributor can run the same
      # check before pushing. It also covers what the inline version did not:
      # the ADRs under docs/adr/, CONTRIBUTING.md, SECURITY.md, and the
      # repository paths this codebase names in its doc comments.
      - name: Every documented path exists
        run: ./scripts/check-links.sh
